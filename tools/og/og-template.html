<html lang="en">
<head>
<meta charset="utf-8">
<title>Kingdom Love Springs OG image</title>
<style>
  @font-face { font-family: "General Sans"; src: url("../../src/assets/fonts/GeneralSans-Medium.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "General Sans"; src: url("../../src/assets/fonts/GeneralSans-Semibold.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Ms Madi"; src: url("../../src/assets/fonts/MsMadi-latin.woff2") format("woff2"); }
  :root { --forest: #17224F; --forest-700: #4B2A7E; --sage: #FCE7A2; --sun: #F6C744; --clay: #E0344B; --cream: #FCF9F2; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--forest); color: var(--cream); font-family: "General Sans", sans-serif; position: relative; }
  .sun { position: absolute; right: -120px; bottom: -220px; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle, rgba(138,99,210,.45), rgba(138,99,210,0) 68%); }
  .ring { position: absolute; right: 70px; top: 85px; width: 460px; height: 460px; border-radius: 50%; border: 1.5px solid rgba(252,231,162,.35); }
  .disc { position: absolute; right: 100px; top: 115px; width: 400px; height: 400px; border-radius: 50%; background: var(--cream); display: grid; place-items: center; overflow: hidden; }
  .disc img { width: 100%; height: 100%; transform: scale(1.1); }
  .brand { position: absolute; left: 80px; top: 72px; display: flex; align-items: center; gap: 18px; font-weight: 600; font-size: 30px; letter-spacing: -0.02em; }
  .mark { width: 60px; height: 60px; border-radius: 50%; box-shadow: 0 0 0 3px var(--sage); }
  h1 { position: absolute; left: 80px; top: 210px; margin: 0; width: 640px; font-weight: 500; font-size: 64px; line-height: 1.06; letter-spacing: -0.025em; }
  .script { position: absolute; left: 110px; top: 405px; font-family: "Ms Madi", cursive; font-size: 76px; color: var(--sun); transform: rotate(-4deg); }
  .swoosh { position: absolute; left: 70px; top: 455px; }
  .foot { position: absolute; left: 80px; bottom: 30px; font-size: 22px; font-weight: 500; color: rgba(252,249,242,.78); }
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="ring"></div>
  <div class="disc"><img src="../../src/assets/images/brand/kls-logo.png" alt=""></div>
  <div class="brand"><img class="mark" src="../../src/assets/images/brand/kls-mark.png" alt="">Kingdom Love Springs</div>
  <h1>Helping children and youth thrive in school, in life and in faith</h1>
  <div class="script">from struggle to purpose</div>
  <svg class="swoosh" width="620" height="80" viewBox="0 0 620 80" fill="none"><path d="M10 50C180 78 420 70 610 12" stroke="#F6C744" stroke-width="5" stroke-linecap="round"/></svg>
  <p class="foot">Education · Football · Mentorship · across Kenya</p>
</body>
</html>
